name: suggest_a_feature
description: Ready-made Flutter package for collecting suggestions from users.
version: 0.5.2
repository: https://github.com/flutterwtf/Suggest-a-Feature
homepage: https://pub.dev/packages/suggest_a_feature

topics:
  - suggestions
  - bug-reporting
  - feedback

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.9
  intl: ^0.20.2
  wtf_sliding_sheet: ^1.1.5

dev_dependencies:
  build_runner: ^2.9.0
  flutter_test:
    sdk: flutter
  vector_graphics_compiler: ^1.1.19
  very_good_analysis: ^9.0.0

flutter:
  assets:
    - assets/
